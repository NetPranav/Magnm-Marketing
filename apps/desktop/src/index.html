<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Magnm Studio</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      background: #ffffff;
      color: #3b3b3b;
      -webkit-font-smoothing: antialiased;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 32px;
      text-align: center;
    }

    .wordmark {
      font-family: 'Instrument Serif', Georgia, serif;
      font-weight: 400;
      font-size: 64px;
      line-height: 1;
      letter-spacing: -0.02em;
      color: #0a0a0a;
      user-select: none;
    }

    .status {
      font-family: 'DM Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #3b3b3b;
    }
  </style>
</head>
<body>
  <main>
    <div class="wordmark">magnm</div>
    <p class="status">STARTING ENGINE</p>
  </main>
</body>
</html>
