import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

def supabaseConfigFile = file("$rootDir/../../../config/supabase.json")
if (!supabaseConfigFile.exists()) {
    throw new GradleException("Missing config/supabase.json at ${supabaseConfigFile}")
}
def supabaseJson = new JsonSlurper().parse(supabaseConfigFile)
def rawSupabaseUrl = (supabaseJson.url ?: "").toString().trim().replaceAll('/+$', '')
def supabaseUri = new URI(rawSupabaseUrl)
if (!"https".equalsIgnoreCase(supabaseUri.scheme) || !supabaseUri.host) {
    throw new GradleException("config/supabase.json url must be an https origin")
}
def supabaseOrigin = "https://${supabaseUri.host.toLowerCase(Locale.ROOT)}"

// Release signing comes only from the environment of the person who releases (see docs/RELEASING.md). The keystore
// and its passwords never live in the repository. Debug builds do not use any of this.
def releaseKeystore = System.getenv("MAGNM_ANDROID_KEYSTORE")
def releaseKeystorePassword = System.getenv("MAGNM_ANDROID_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("MAGNM_ANDROID_KEY_ALIAS")
def releaseSigningReady = releaseKeystore && releaseKeystorePassword && releaseKeyAlias

android {
    namespace = "com.magnm.studio"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        applicationId "com.magnm.studio"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 100
        versionName "0.1.0"
        buildConfigField "String", "SUPABASE_ORIGIN", "\"${supabaseOrigin}\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile new File(releaseKeystore)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword System.getenv("MAGNM_ANDROID_KEY_PASSWORD") ?: releaseKeystorePassword
            }
        }
    }
    buildTypes {
        release {
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// A release APK that is not signed cannot be installed or updated, so refuse to build one by accident.
gradle.taskGraph.whenReady { graph ->
    def wantsRelease = graph.allTasks.any { it.path.startsWith(':app:') && it.name in ['assembleRelease', 'packageRelease', 'bundleRelease'] }
    if (wantsRelease && !releaseSigningReady) {
        throw new GradleException("A release build needs MAGNM_ANDROID_KEYSTORE, MAGNM_ANDROID_KEYSTORE_PASSWORD and MAGNM_ANDROID_KEY_ALIAS (see docs/RELEASING.md).")
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
