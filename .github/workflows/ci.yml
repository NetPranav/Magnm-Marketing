name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-tests:
    name: Engine tests (Python ${{ matrix.python }}, ${{ matrix.deps }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
        deps: ["stdlib-only", "with-requirements"]
    env:
      MAGNM_DISABLE_SCHEDULER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install optional engine libraries (ddgs, playwright, pillow)
        if: matrix.deps == 'with-requirements'
        run: python -m pip install -r engine/requirements.txt
      - name: Install Pillow only (card rendering tests)
        if: matrix.deps == 'stdlib-only'
        run: python -m pip install pillow
      - name: Syntax check
        run: python -c "import ast,glob; [ast.parse(open(f, encoding='utf-8').read(), f) for f in glob.glob('engine/**/*.py', recursive=True)]"
      - name: Unit tests (no network)
        run: python -m unittest discover -s engine/tests -t . -v

  desktop-check:
    name: Desktop app (Rust check + tests)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Placeholder engine sidecar (the real one is built by the release workflow)
        run: |
          mkdir -p binaries
          TRIPLE=$(rustc -vV | sed -n 's/^host: //p')
          printf '#!/bin/sh\nexit 1\n' > "binaries/magnm-engine-$TRIPLE"
          chmod +x "binaries/magnm-engine-$TRIPLE"
      - name: cargo check
        run: cargo check --all-targets
      - name: cargo test
        run: cargo test

  design-kit:
    name: Design kit checks (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Design kit tests
        run: node --test "packages/magnm-design/scripts/*.test.mjs"
      - name: Vendored Pitch rules check
        run: node scripts/check_pitch_rules.mjs

  web:
    name: Web app (Node 22, pnpm)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Pitch host adapter tests
        working-directory: .
        run: node --test scripts/pitch_host.test.mjs
      - name: Build
        run: pnpm build

  supabase:
    name: Supabase schema & privacy tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1
      - name: Start local Supabase database and auth schema
        run: supabase start -x studio,imgproxy,vector,logflare,edge-runtime,realtime,storage-api,postgrest,postgres-meta,mailpit,supavisor
      - name: Reset local database without seed
        run: supabase db reset --local --no-seed
      - name: Run SQL privacy and schema guard tests
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: supabase/dev.sh test

  mobile:
    name: Mobile app (tests + Android debug APK)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: apps/mobile/pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Build bundled Pitch
        run: pnpm run build:pitch
      - name: Unit tests
        run: pnpm test
      - name: Build web bundle
        run: pnpm build
      - name: Sync Capacitor Android project
        run: pnpm android:sync
      - name: Android unit tests, lint, and debug APK
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon --max-workers=2 testDebugUnitTest lintDebug assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: magnm-studio-android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  engine-smoke:
    name: Engine smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Build magnm-engine sidecar binary
        run: python scripts/build_engine.py
      - name: Run engine smoke test on frozen binary
        shell: bash
        run: |
          TRIPLE=$(rustc -vV | sed -n 's/^host: //p')
          BIN="apps/desktop/src-tauri/binaries/magnm-engine-${TRIPLE}"
          if [ -f "${BIN}.exe" ]; then
            BIN="${BIN}.exe"
          fi
          python scripts/smoke_test.py --engine-bin "${BIN}"
