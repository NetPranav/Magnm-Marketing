name: Desktop Release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux-x86_64
          - os: windows-latest
            label: windows-x86_64
          - os: macos-15
            label: macos-arm64
          - os: macos-15-intel
            label: macos-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify updater signing configuration
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          python - <<'EOF'
          import json
          import os
          import sys

          if not (os.environ.get("TAURI_SIGNING_PRIVATE_KEY") or "").strip():
              sys.exit("ERROR: TAURI_SIGNING_PRIVATE_KEY repository secret is missing. See apps/desktop/RELEASING.md.")

          conf_path = os.path.join("apps", "desktop", "src-tauri", "tauri.conf.json")
          with open(conf_path, "r", encoding="utf-8") as f:
              cfg = json.load(f)
          pubkey = str((cfg.get("plugins") or {}).get("updater", {}).get("pubkey") or "").strip()
          if not pubkey or pubkey == "REPLACE_WITH_TAURI_UPDATER_PUBKEY":
              sys.exit("ERROR: plugins.updater.pubkey in apps/desktop/src-tauri/tauri.conf.json is missing or still a placeholder. See apps/desktop/RELEASING.md.")

          print("Updater signing configuration verified.")
          EOF

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: |
            apps/desktop/pnpm-lock.yaml
            apps/web/pnpm-lock.yaml

      - name: Build magnm-engine sidecar binary
        run: python scripts/build_engine.py

      - name: Smoke test magnm-engine sidecar binary
        shell: bash
        run: |
          TRIPLE=$(rustc -vV | sed -n 's/^host: //p')
          BIN="apps/desktop/src-tauri/binaries/magnm-engine-${TRIPLE}"
          if [ -f "${BIN}.exe" ]; then
            BIN="${BIN}.exe"
          fi
          python scripts/smoke_test.py --engine-bin "${BIN}"

      - name: Install Linux desktop dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libdbus-1-dev \
            pkg-config

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Build and upload Tauri release artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Magnm Studio ${{ github.ref_name }}"
          releaseDraft: true
          includeUpdaterJson: true
