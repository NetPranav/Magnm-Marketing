name: Desktop installers

# Builds installable packages for every desktop platform and keeps them as workflow artifacts:
# Linux .deb, .rpm and .AppImage; macOS .dmg (Apple Silicon and Intel); Windows .msi and .exe.
# They are unsigned until the owner adds signing keys (see apps/desktop/RELEASING.md); the signed release with
# auto-update still comes from desktop-release.yml.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/desktop-installers.yml"
      - "apps/desktop/**"
      - "scripts/build_engine.py"

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installers:
    name: Installers (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux-x86_64
            bundles: deb,rpm,appimage
            files: |
              apps/desktop/src-tauri/target/release/bundle/deb/*.deb
              apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
              apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          - os: windows-latest
            label: windows-x86_64
            bundles: msi,nsis
            files: |
              apps/desktop/src-tauri/target/release/bundle/msi/*.msi
              apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-15
            label: macos-apple-silicon
            bundles: dmg
            files: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          - os: macos-15-intel
            label: macos-intel
            bundles: dmg
            files: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: |
            apps/desktop/pnpm-lock.yaml
            apps/web/pnpm-lock.yaml
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config rpm
      - name: Build the engine
        run: python scripts/build_engine.py
      - name: Smoke test the engine
        shell: bash
        run: |
          TRIPLE=$(rustc -vV | sed -n 's/^host: //p')
          BIN="apps/desktop/src-tauri/binaries/magnm-engine-${TRIPLE}"
          [ -f "${BIN}.exe" ] && BIN="${BIN}.exe"
          python scripts/smoke_test.py --engine-bin "${BIN}"
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      - name: Build installers (unsigned, no auto-update files)
        working-directory: apps/desktop
        shell: bash
        run: pnpm tauri build --bundles ${{ matrix.bundles }} --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Keep the installers
        uses: actions/upload-artifact@v4
        with:
          name: magnm-studio-${{ matrix.label }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 30
